name: Publish season planner

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh public history]
    types: [completed]
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -e '.[dev]'
          npm ci --prefix web
      - name: Check Python and browser optimization
        run: |
          python -m pytest
          npm test --prefix web
      - name: Generate fresh public forecasts
        timeout-minutes: 5
        run: python -m f1fantasy.web_data
      - name: Build the static website
        run: npm run build --prefix web
      - name: Preserve first pre-weekend forecasts
        run: |
          if test -f data/forecast-archive.json; then
            git add data/forecast-archive.json
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Archive pre-weekend forecast evidence'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
