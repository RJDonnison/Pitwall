name: Fit model parameters

# Runs after each successful history refresh. A fit only changes data/model-params.json
# when the gate in f1fantasy.model_fit passes (one step per newly finished race,
# confirmed on the latest races), so most runs end with "No new race".
on:
  workflow_dispatch:
    inputs:
      force:
        description: Refit even if no new race has finished
        type: boolean
        default: false
  workflow_run:
    workflows: [Refresh public history]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: public-history
  cancel-in-progress: false

jobs:
  fit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Fit parameters on the walk-forward backtest
        run: python -m f1fantasy.model_fit ${{ inputs.force && '--force' || '' }}
      - name: Check the fitted file is accepted by the model and the tests still pass
        run: python -m pytest tests/test_model_fit.py tests/test_racing_model.py tests/test_predict_model.py tests/test_web_data.py
      - name: Refresh the published evaluation with the fitted settings
        run: |
          if ! git diff --quiet -- data/model-params.json; then
            python -m f1fantasy.racing_evaluation
          fi
      - name: Commit the fit
        run: |
          git add data/model-params.json data/racing-evaluation.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refit racing-model parameters on the walk-forward backtest'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
